[project]
name = "moon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.12.15",
    "alembic==1.16.4",
    "asyncpg==0.30.0",
    "fastapi==0.116.1",
    "faststream[nats]==0.5.48",
    "geoalchemy2>=0.18.0",
    "inject==5.3.0",
    "opentelemetry-api==1.31.0",
    "opentelemetry-instrumentation-fastapi==0.52b0",
    "opentelemetry-sdk==1.31.0",
    "orjson==3.11.2",
    "psycopg2-binary==2.9.10",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "redis==4.6.0",
    "sentry-sdk[fastapi]==2.35.0",
    "shapely>=2.1.2",
    "structlog==25.4.0",
    "uvicorn==0.35.0",
    "uvloop==0.21.0",
]


[dependency-groups]
dev = [
    "faker>=37.6.0",
    "polyfactory>=2.22.2",
    "rich==13.9.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"


[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".env",
    ".venv",
]

[format]
    quote-style = "double"
    skip-magic-trailing-comma = false

[lint]

    select = [
        "E",   # Pyflakes errors
        "F",   # Pyflakes code checks
        "W",   # Pyflakes warnings
        "C",   # McCabe complexity
        "B",   # Bugbear
        "RUF", # Ruff-specific
        "I",   # Import sorting
        "UP",  # Pyupgrade
        "PL",  # Pylint
    ]

    ignore = [
        "PLR0913",  # Too many arguments
        "PLR0912",  # Too many branches
        "PLR0915",  # Too many statements
        "PLW0603",  # Global statement usage
        "PLW0602",  # Global variable undefined
        "PLR0911",  # Too many return statements
        "PLC0414",  # Import alias does not rename variable
        "PLR2004",  # Magic value used in comparison
        "RUF002",   # Cyrillic in docstring
        "RUF003",   # Cyrillic in comment
    ]

    task-tags = ["FIXME", "TODO", "XXX"]

[lint.flake8-tidy-imports]
    ban-relative-imports = "all"

[lint.per-file-ignores]
    "__init__.py" = ["E402"]

[lint.pydocstyle]
    convention = "google"

[lint.pylint]
    max-args = 6
    max-branches = 8
    max-returns = 5
    max-statements = 30
    max-locals = 10
    max-bool-expr = 5

[lint.mccabe]
    max-complexity = 7

[lint.isort]
    combine-as-imports = true
    force-sort-within-sections = true
    lines-after-imports = 2
    order-by-type = true
